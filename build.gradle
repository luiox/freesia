import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.luiox'
version = '2.2'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	// The dispatch path needs MethodHandles.privateLookupIn, Method.trySetAccessible and
	// System.Logger, which are Java 9; List.copyOf in the diagnostic accessor is Java 10.
	// Pinning release here makes the compiler reject any newer API by accident, instead of
	// leaving the true baseline to be discovered as a compile error in someone else's build.
	options.release = 11
}

tasks.withType(Javadoc).configureEach {
	// Without this the javadoc tool reads the UTF-8 sources with the platform default
	// charset and every non-ASCII comment comes out as mojibake - or fails outright.
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.docEncoding = 'UTF-8'
	// Keep the checks that catch real damage (malformed HTML, broken @link) but stop
	// insisting on a @param for every public member of an internal type.
	options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    maven {
        url = uri('https://maven.aliyun.com/repository/public/')
    }
    mavenCentral()
    maven {
        url = uri('https://www.jitpack.io')
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.register('benchmarkTest', Test) {
    useJUnitPlatform()
    // A bare Test task has no classpath of its own, so without these two lines the task
    // silently finds nothing to run.
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/EventManagerPerformanceTest.class'
    systemProperty 'freesia.benchmark', 'true'
    // Microbenchmarks are only meaningful on a quiet machine; the default per-test fork
    // would compete with the JIT for the cores being measured.
    maxParallelForks = 1
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group.toString()
            artifactId = project.name
            version = project.version.toString()
            from components.java

            pom {
                name = "${project.group}:${project.name}"
                description = 'A modern, high-performance, low-latency Java event bus'
                url = 'https://github.com/luiox/freesia'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/luiox/freesia/blob/main/LICENSE'
                    }
                }

                developers {
                    developer {
                        id = 'luiox'
                        name = 'Canrad'
                        email = '1517807724@qq.com'
                    }
                }
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf {
        repository.name != 'MavenLocal' || project.hasProperty('publishToLocal')
    }
}